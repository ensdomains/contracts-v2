name: Vyper GPT-5.6 completion toolchain

on:
  push:
    branches:
      - experiment/vyper-complete-gpt56
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Vyper and warm compiler caches
        run: |
          python -m venv .venv-vyper
          .venv-vyper/bin/pip install 'vyper==0.5.0a3'
          cd contracts
          forge build
      - name: Package Vyper environment
        run: |
          tar -czf /tmp/vyper-env.tar.gz .venv-vyper
      - uses: actions/upload-artifact@v4
        with:
          name: vyper-env-${{ github.sha }}
          path: /tmp/vyper-env.tar.gz
          compression-level: 0
          retention-days: 3
      - name: Package Foundry and Solidity compilers
        run: |
          mkdir -p /tmp/local-toolchain/bin /tmp/local-toolchain/home
          for tool in forge cast anvil chisel bun; do
            path=$(command -v "$tool" || true)
            if [ -n "$path" ]; then cp -L "$path" /tmp/local-toolchain/bin/; fi
          done
          if [ -d "$HOME/.svm" ]; then cp -a "$HOME/.svm" /tmp/local-toolchain/home/svm; fi
          tar -C /tmp -czf /tmp/foundry-toolchain.tar.gz local-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-toolchain-${{ github.sha }}
          path: /tmp/foundry-toolchain.tar.gz
          compression-level: 0
          retention-days: 3
