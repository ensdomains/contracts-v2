name: Vyper local dependency snapshot

on:
  push:
    branches:
      - experiment/vyper-complete-gpt56
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-js-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Package and split dependency tree
        run: |
          set -euo pipefail
          paths=(node_modules)
          if [ -d contracts/node_modules ]; then paths+=(contracts/node_modules); fi
          tar -czf /tmp/js-deps.tar.gz "${paths[@]}"
          split -b 160M -d -a 2 /tmp/js-deps.tar.gz /tmp/js-deps.part-
          ls -lh /tmp/js-deps.part-*
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-00-${{ github.sha }}
          path: /tmp/js-deps.part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-01-${{ github.sha }}
          path: /tmp/js-deps.part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-02-${{ github.sha }}
          path: /tmp/js-deps.part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-03-${{ github.sha }}
          path: /tmp/js-deps.part-03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-04-${{ github.sha }}
          path: /tmp/js-deps.part-04
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-05-${{ github.sha }}
          path: /tmp/js-deps.part-05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-06-${{ github.sha }}
          path: /tmp/js-deps.part-06
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: js-deps-07-${{ github.sha }}
          path: /tmp/js-deps.part-07
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
