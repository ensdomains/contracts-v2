name: Vyper GPT-5.6 workspace snapshot

on:
  push:
    branches:
      - experiment/vyper-complete-gpt56
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Package checkout
        run: |
          tar --exclude=.git --exclude='**/.git' -czf /tmp/contracts-v2-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-v2-source-${{ github.sha }}
          path: /tmp/contracts-v2-source.tar.gz
          retention-days: 3
