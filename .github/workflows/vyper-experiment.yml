name: Vyper experiment

"on":
  push:
    branches:
      - experiment/vyper-a971bd6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyper-experiment-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-vyper:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[alpha-ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Package Vyper 0.5.0a3
        run: |
          set -euxo pipefail
          rm -rf /tmp/vyper-0.5.0a3
          python -m pip install --target /tmp/vyper-0.5.0a3 'vyper==0.5.0a3'
          PYTHONPATH=/tmp/vyper-0.5.0a3 python -m vyper --version

      - uses: actions/upload-artifact@v4
        with:
          name: vyper-0.5.0a3-python
          path: /tmp/vyper-0.5.0a3
          include-hidden-files: true
          retention-days: 1

      - name: Publish artifact run id/status
        if: always()
        run: |
          mkdir -p vyper-results
          {
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
          } > vyper-results/alpha-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- vyper-results/alpha-run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish Vyper alpha run [alpha-ci]'
            git push origin HEAD:experiment/vyper-a971bd6
          fi
