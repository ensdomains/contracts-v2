name: Vyper experiment

"on":
  push:
    branches:
      - experiment/vyper-a971bd6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyper-experiment-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build portable toolchain bundle
        run: |
          set -euxo pipefail
          rm -rf /tmp/vyper-toolchain
          mkdir -p /tmp/vyper-toolchain/bin /tmp/vyper-toolchain/python
          cp "$(command -v forge)" /tmp/vyper-toolchain/bin/
          cp "$(command -v cast)" /tmp/vyper-toolchain/bin/
          cp "$(command -v anvil)" /tmp/vyper-toolchain/bin/
          cp "$(command -v chisel)" /tmp/vyper-toolchain/bin/ || true
          cp "$(command -v bun)" /tmp/vyper-toolchain/bin/
          python -m pip install --target /tmp/vyper-toolchain/python 'vyper==0.4.3'
          cat > /tmp/vyper-toolchain/bin/vyper <<'SH'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$HERE/python${PYTHONPATH:+:$PYTHONPATH}" exec python3 -m vyper "$@"
          SH
          chmod +x /tmp/vyper-toolchain/bin/vyper
          {
            uname -a
            forge --version
            bun --version
            PYTHONPATH=/tmp/vyper-toolchain/python python3 -m vyper --version
          } > /tmp/vyper-toolchain/VERSIONS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vyper-local-toolchain
          path: /tmp/vyper-toolchain
          retention-days: 1
