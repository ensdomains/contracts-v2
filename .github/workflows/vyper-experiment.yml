name: Vyper experiment

"on":
  push:
    branches:
      - experiment/vyper-a971bd6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyper-experiment-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[toolchain-ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build portable workspace bundle
        run: |
          set -euxo pipefail
          rm -rf /tmp/vyper-toolchain
          mkdir -p /tmp/vyper-toolchain/bin /tmp/vyper-toolchain/python
          cp "$(command -v forge)" /tmp/vyper-toolchain/bin/
          cp "$(command -v cast)" /tmp/vyper-toolchain/bin/
          cp "$(command -v anvil)" /tmp/vyper-toolchain/bin/
          cp "$(command -v chisel)" /tmp/vyper-toolchain/bin/ || true
          cp "$(command -v bun)" /tmp/vyper-toolchain/bin/
          python -m pip install --target /tmp/vyper-toolchain/python 'vyper==0.4.3'
          cat > /tmp/vyper-toolchain/bin/vyper <<'SH'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "$0")/.." && pwd)"
          PYTHONPATH="$HERE/python${PYTHONPATH:+:$PYTHONPATH}" exec python3 -m vyper "$@"
          SH
          chmod +x /tmp/vyper-toolchain/bin/vyper
          {
            uname -a
            forge --version
            bun --version
            PYTHONPATH=/tmp/vyper-toolchain/python python3 -m vyper --version
          } > /tmp/vyper-toolchain/VERSIONS.txt

          tar \
            --exclude=.git \
            --exclude='**/.git' \
            --exclude='contracts/out' \
            --exclude='contracts/cache' \
            -czf /tmp/contracts-v2-prepared.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: vyper-local-workspace
          path: |
            /tmp/vyper-toolchain
            /tmp/contracts-v2-prepared.tgz
          retention-days: 1

      - name: Publish artifact run id/status
        if: always()
        run: |
          mkdir -p vyper-results
          {
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
          } > vyper-results/toolchain-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- vyper-results/toolchain-run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish Vyper toolchain run [toolchain-ci]'
            git push origin HEAD:experiment/vyper-a971bd6
          fi
