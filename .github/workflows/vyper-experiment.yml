name: Vyper experiment

"on":
  push:
    branches:
      - experiment/vyper-a971bd6
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyper-experiment-solc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solc-cache:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[toolchain-ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Populate required solc versions
        run: |
          set -euxo pipefail
          cd contracts
          forge build --force >/tmp/forge-build.log 2>&1 || { cat /tmp/forge-build.log; exit 1; }
          cat /tmp/forge-build.log
          ls -R "$HOME/.svm" || true

      - uses: actions/upload-artifact@v4
        with:
          name: vyper-local-solc-cache
          path: ~/.svm
          include-hidden-files: true
          retention-days: 1

      - name: Publish artifact run id/status
        if: always()
        run: |
          mkdir -p vyper-results
          {
            echo 'run_id=${{ github.run_id }}'
            echo 'status=${{ job.status }}'
          } > vyper-results/solc-run.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- vyper-results/solc-run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish solc cache run [toolchain-ci]'
            git push origin HEAD:experiment/vyper-a971bd6
          fi
