# https://book.getfoundry.sh/reference/config/overview
# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
gas_reports = ["*"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
skip = ["HCAProxyInitCode.yul", "HCAProxyNoInitCode.yul"]
ignored_warnings_from = ["lib/", "src/hca/HCAProxyInitCode.yul"]

[fuzz]
runs = 4096

[profile.yul]
skip = []

[profile.hca-formal]
src = "src/hca"
test = "test/formal/hca"
script = "script/formal"
out = "out/hca-formal"
cache_path = "cache/hca-formal"
solc = "0.8.27"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
dynamic_test_linking = false
ast = true
extra_output = ["storageLayout", "metadata"]
gas_reports = []

[lint]
lint_on_build = false
